# The default json-file logging driver grows without bound, and dt-api is
# chatty. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dt-postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-dt}
    ports:
      - "12300:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dt}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # dt-ipcamera:
  #   build:
  #     context: ./src/digital_twin_builder/ipcamera
  #   ports:
  #     - "12302:8080"
  #   volumes:
  #     - python-bindings:/app/src/digital_twin_builder/ipcamera/python

  # dt-python:
  #   build:
  #     context: .
  #   working_dir: /app
  #   volumes:
  #     - python-bindings:/app/src/digital_twin_builder/ipcamera/python
  #   depends_on:
  #     - dt-ipcamera
  #     - dt-postgres
  #   command: python main.py
  #   environment:
  #     - PYTHONPATH=/digital_twin_builder

  dt-api:
    build:
      context: .
      args:
        REQS: requirements-api.txt
    profiles: ["full"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    depends_on:
      dt-postgres:
        condition: service_healthy
    environment:
      - DB_HOST=dt-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-dt}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      # The DB/DES pipeline reads these from the environment (config.py), and
      # docker compose interpolates them from the project .env. DES_PYTHON is
      # deliberately not passed: inside the image the interpreter that has simpy
      # is sys.executable, the default.
      - DB_REPAIR_ATTEMPTS=${DB_REPAIR_ATTEMPTS:-3}
      - DES_REPAIR_ATTEMPTS=${DES_REPAIR_ATTEMPTS:-3}
      - DES_EXEC_TIMEOUT_S=${DES_EXEC_TIMEOUT_S:-900}
      - DES_GEN_TIMEOUT_S=${DES_GEN_TIMEOUT_S:-900}
      - DES_MAX_TOKENS=${DES_MAX_TOKENS:-8000}
    command: python api-server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    profiles: ["frontend", "full"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:80"
    # dt-api lives in the `full` profile only. `required: false` keeps
    # `--profile frontend` a valid project on its own, while under `full` it
    # still gates on the healthcheck — without the gate nginx resolves the
    # `dt-api` hostname at startup, before anything answers, and the container
    # exits with `[emerg] host not found in upstream "dt-api"`.
    depends_on:
      dt-api:
        condition: service_healthy
        required: false
    environment:
      # nginx proxies /api/ here. The default is the compose service, which only
      # resolves under `--profile full`; when running `--profile frontend` alone
      # against an API on another host, set API_UPSTREAM in .env.
      - API_UPSTREAM=${API_UPSTREAM:-http://dt-api:8000/}

  # --- Anomaly detection stack (merged from ITMO/anomaly-detection) ---
  #
  # This stack runs on the user's machine, not on the server: the Modbus
  # sensors and RTSP cameras it reads are on their network, and the config it
  # needs is the session they generated here. The Digital Twin tab prints the
  # command, which carries DTB_API_URL and DTB_SESSION_ID; config-sync downloads
  # that session's config.json before anything reads it, so the user never edits
  # a config file.
  #
  # Both variables are required, but the check lives in the container's shell
  # rather than in a `${VAR:?}` here: compose interpolates the whole file before
  # it applies a profile, so a required variable in this service aborts every
  # other command too — `docker compose up -d` for the main app stopped working
  # without the two exports. The `:?` below still fails loudly, at startup,
  # before the detector can poll devices nobody configured.
  config-sync:
    image: curlimages/curl:8.11.1
    profiles: ["anomaly"]
    logging: *default-logging
    # The curl image runs as an unprivileged `curl_user`, and a fresh named
    # volume is root-owned, so without this curl fails to write the file it
    # just downloaded (curl error 23).
    user: "0:0"
    environment:
      DTB_API_URL: ${DTB_API_URL:-}
      DTB_SESSION_ID: ${DTB_SESSION_ID:-}
    volumes:
      - anomaly_config:/app/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${DTB_API_URL:?run the command from the Digital Twin tab, or export DTB_API_URL}"
        : "$${DTB_SESSION_ID:?run the command from the Digital Twin tab, or export DTB_SESSION_ID}"
        url="$${DTB_API_URL%/}/anomaly/config/$$DTB_SESSION_ID"
        echo "Fetching $${url}"
        # The API is remote, so a stack brought up before the network (or the
        # broker itself) is reachable must wait rather than fail the whole
        # profile. Five minutes, then give up loudly.
        i=1
        while [ "$$i" -le 150 ]; do
          if curl -fsS "$${url}" -o /app/config/config.json; then
            echo "Wrote /app/config/config.json"
            exit 0
          fi
          if [ "$$((i % 15))" -eq 1 ]; then
            echo "Not ready yet (attempt $${i}/150)"
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "Could not fetch the session config from $${url} after 150 attempts" >&2
        exit 1

  anomaly-postgres:
    image: postgres:16
    profiles: ["anomaly"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: anomalydb
      POSTGRES_PASSWORD: anomalydb
      POSTGRES_DB: anomaly_db
    ports:
      - "12310:5432"
    volumes:
      - anomaly-postgres-data:/var/lib/postgresql/data
      - ./anomaly/init:/docker-entrypoint-initdb.d    # schema loaded on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomalydb -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  anomaly-api:
    build: ./anomaly
    profiles: ["anomaly"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://anomalydb:anomalydb@anomaly-postgres:5432/anomaly_db
      PYTHONUNBUFFERED: "1"
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Where the *browser* running Grafana reaches this API. The dashboard's
      # Train/toggle/status buttons are plain fetch calls from the page, so they
      # need the published port (8001) rather than the in-network 8000 that this
      # container itself listens on.
      ANOMALY_API_PUBLIC_URL: ${ANOMALY_API_PUBLIC_URL:-http://localhost:8001}
    depends_on:
      anomaly-postgres:
        condition: service_healthy
      config-sync:
        condition: service_completed_successfully
      # The startup config load creates the session's zone and provisions its
      # Grafana dashboard, so Grafana has to be answering before this starts;
      # otherwise the dashboard call fails and the load is abandoned.
      grafana:
        condition: service_healthy
    volumes:
      - anomaly_config:/app/config
      - anomaly_frames:/anomaly_frames
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    profiles: ["anomaly"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
      GF_SMTP_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./anomaly/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./anomaly/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./anomaly/grafana/grafana.ini:/etc/grafana/grafana.ini
    depends_on:
      - anomaly-postgres
    # anomaly-api gates on this being healthy (its startup config load talks to
    # Grafana), so `/api/health` answering means provisioning has run too.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The detector reads the user's devices, so it runs wherever they are. There
  # is no GPU reservation here: the base file is the CPU path (the camera model
  # already falls back to cpu), and `docker-compose.gpu.yml` adds the nvidia
  # reservation for a machine that has one. The Modbus/RTSP capture loops write
  # camera frames into the camera volume themselves, so it is read-write.
  anomaly-detector:
    build:
      context: ./anomaly
      dockerfile: detector/Dockerfile
    profiles: ["anomaly"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://anomalydb:anomalydb@anomaly-postgres:5432/anomaly_db
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Where the RTSP capture loop writes the user's camera frames and CKAAD
      # reads them. `camera_frames` is raw capture; `anomaly_frames` holds the
      # snapshots and heatmaps the alert panels link to.
      FRAME_DIR: /tmp/anomaly_frames
      # The alert rows the detector writes link to anomaly frames by absolute
      # URL, and the panel that renders them is a browser on the user's machine
      # — so the link has to name the published port, not this network's.
      ANOMALY_API_PUBLIC_URL: ${ANOMALY_API_PUBLIC_URL:-http://localhost:8001}
      SENSOR_DETECT_INTERVAL: "30"
      CAMERA_DETECT_INTERVAL: "15"
      FUSION_INTERVAL: "30"
      # How often the RTSP loop grabs a frame, and how old a frame may be before
      # it is treated as a dead stream and scored no more (default: 3 captures).
      CAMERA_CAPTURE_INTERVAL_S: "15"
      # One alert per episode, not one per detection interval: a score that
      # stays over the threshold does not re-alert until the cooldown elapses,
      # and a cleared condition alerts at once next time.
      SENSOR_ALERT_COOLDOWN_S: "300"
      CAMERA_ALERT_COOLDOWN_S: "300"
      FUSION_ALERT_COOLDOWN_S: "300"
      # A camera's fused score decays by this factor each pass, so one spike
      # does not keep the camera "anomalous" forever.
      CAMERA_ROLLING_MAX_DECAY: "0.5"
      MODBUS_POLL_INTERVAL_S: "5"
      MODBUS_BACKOFF_BASE_S: "5"
      MODBUS_BACKOFF_MAX_S: "300"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - anomaly_config:/app/config
      - camera_frames:/tmp/anomaly_frames
      - anomaly_frames:/anomaly_frames
    depends_on:
      anomaly-postgres:
        condition: service_healthy
      anomaly-api:
        condition: service_started
      config-sync:
        condition: service_completed_successfully

volumes:
  postgres-data:
  anomaly-postgres-data:
  grafana_data:
  camera_frames:
  anomaly_frames:
  anomaly_config:
  # python-bindings:
