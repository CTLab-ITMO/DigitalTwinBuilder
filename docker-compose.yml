  dt-api:
    build:
      context: .
      args:
        REQS: requirements-api.txt
    profiles: ["full"]
    ports:
      - "8000:8000"
    depends_on:
      dt-postgres:
        condition: service_healthy
    environment:
      - DB_HOST=dt-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-dt}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
    command: python api-server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    profiles: ["frontend", "full"]
    ports:
      - "8080:80"
    environment:
      - API_UPSTREAM=http://194.87.94.36:8000/

volumes:
  postgres-data:
