  dt-api:
    build: .
    profiles: ["full"]
    ports:
      - "8000:8000"
    depends_on:
      - dt-postgres
    environment:
      - DB_HOST=dt-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-dt}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
    command: python src/digital_twin_builder/api-server.py

  frontend:
    build: .
    profiles: ["frontend", "full"]
    ports:
      - "8501:8501"
    depends_on:
      - dt-api
    environment:
      - API_URL=http://dt-api:8000
    command: streamlit run src/digital_twin_builder/streamlit-app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  postgres-data:
