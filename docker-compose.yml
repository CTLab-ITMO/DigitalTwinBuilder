services:
  dt-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-dt}
    ports:
      - "12300:5432"
    volumes:
      - postgres-data:/home/nvasiliev/DigitalTwinBuilder/db

