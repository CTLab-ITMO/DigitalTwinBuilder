  dt-api:
    build:
      context: .
      args:
        REQS: requirements-api.txt
    profiles: ["full"]
    ports:
      - "8000:8000"
    depends_on:
      dt-postgres:
        condition: service_healthy
    environment:
      - DB_HOST=dt-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-dt}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      # The DB/DES pipeline reads these from the environment (config.py), and
      # docker compose interpolates them from the project .env. DES_PYTHON is
      # deliberately not passed: inside the image the interpreter that has simpy
      # is sys.executable, the default.
      - DB_REPAIR_ATTEMPTS=${DB_REPAIR_ATTEMPTS:-3}
      - DES_REPAIR_ATTEMPTS=${DES_REPAIR_ATTEMPTS:-3}
      - DES_EXEC_TIMEOUT_S=${DES_EXEC_TIMEOUT_S:-900}
      - DES_GEN_TIMEOUT_S=${DES_GEN_TIMEOUT_S:-900}
      - DES_MAX_TOKENS=${DES_MAX_TOKENS:-8000}
    command: python api-server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    profiles: ["frontend", "full"]
    ports:
      - "8080:80"
    # dt-api lives in the `full` profile only. `required: false` keeps
    # `--profile frontend` a valid project on its own, while under `full` it
    # still gates on the healthcheck — without the gate nginx resolves the
    # `dt-api` hostname at startup, before anything answers, and the container
    # exits with `[emerg] host not found in upstream "dt-api"`.
    depends_on:
      dt-api:
        condition: service_healthy
        required: false
    environment:
      # nginx proxies /api/ here. The default is the compose service, which only
      # resolves under `--profile full`; when running `--profile frontend` alone
      # against an API on another host, set API_UPSTREAM in .env.
      - API_UPSTREAM=${API_UPSTREAM:-http://dt-api:8000/}

  # --- Anomaly detection stack (merged from ITMO/anomaly-detection) ---
  anomaly-postgres:
    image: postgres:16
    profiles: ["anomaly"]
    environment:
      POSTGRES_USER: anomalydb
      POSTGRES_PASSWORD: anomalydb
      POSTGRES_DB: anomaly_db
    ports:
      - "12310:5432"
    volumes:
      - anomaly-postgres-data:/var/lib/postgresql/data
      - ./anomaly/init:/docker-entrypoint-initdb.d    # schema loaded on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomalydb -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  anomaly-api:
    build: ./anomaly
    profiles: ["anomaly"]
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://anomalydb:anomalydb@anomaly-postgres:5432/anomaly_db
      PYTHONUNBUFFERED: "1"
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
    depends_on:
      anomaly-postgres:
        condition: service_healthy
    volumes:
      - ./anomaly/config:/app/config
      - anomaly_frames:/anomaly_frames
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    profiles: ["anomaly"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_ALERTING_ENABLED: "true"
      GF_SMTP_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./anomaly/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./anomaly/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./anomaly/grafana/grafana.ini:/etc/grafana/grafana.ini
    depends_on:
      - anomaly-postgres

  anomaly-detector:
    build:
      context: ./anomaly
      dockerfile: detector/Dockerfile
    profiles: ["anomaly"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["all"]
              capabilities: [gpu]
    environment:
      DATABASE_URL: postgresql://anomalydb:anomalydb@anomaly-postgres:5432/anomaly_db
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      FRAME_DIR: /tmp/mvtec_frames
      SENSOR_DETECT_INTERVAL: "30"
      CAMERA_DETECT_INTERVAL: "15"
      FUSION_INTERVAL: "30"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./anomaly/config:/app/config
      - camera_frames:/tmp/mvtec_frames:ro
      - anomaly_frames:/anomaly_frames
    depends_on:
      anomaly-postgres:
        condition: service_healthy
      anomaly-api:
        condition: service_started

volumes:
  postgres-data:
  anomaly-postgres-data:
  grafana_data:
  camera_frames:
  anomaly_frames:
  # python-bindings:
